<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ちょっとやばい">
  <defs>
    <radialGradient id="face" cx="38%" cy="34%" r="68%">
      <stop offset="0%" stop-color="#ffe57a"/>
      <stop offset="55%" stop-color="#fbc92a"/>
      <stop offset="100%" stop-color="#e69a00"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="29" fill="url(#face)" stroke="#a96900" stroke-width="1.5"/>

  <!-- eyebrows: tilted for nervous look -->
  <path d="M15.5 19.5 L25.5 17" stroke="#2a2118" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  <path d="M48.5 19.5 L38.5 17" stroke="#2a2118" stroke-width="2.6" stroke-linecap="round" fill="none"/>

  <!-- eyes -->
  <ellipse cx="22" cy="27" rx="2.5" ry="3.4" fill="#2a2118"/>
  <ellipse cx="42" cy="27" rx="2.5" ry="3.4" fill="#2a2118"/>

  <!-- grimace mouth -->
  <rect x="13" y="40" width="38" height="12" rx="4" fill="#2a2118"/>
  <rect x="15.5" y="42" width="33" height="8" fill="#fffaea"/>

  <!-- teeth divisions -->
  <g stroke="#2a2118" stroke-width="1.4" stroke-linecap="square">
    <line x1="22" y1="42" x2="22" y2="50"/>
    <line x1="28" y1="42" x2="28" y2="50"/>
    <line x1="34" y1="42" x2="34" y2="50"/>
    <line x1="40" y1="42" x2="40" y2="50"/>
    <line x1="15.5" y1="46" x2="48.5" y2="46"/>
  </g>

  <!-- sweat drop -->
  <path d="M52 14 q-3 5 0 9 q3 -4 0 -9 z" fill="#5fb4ff" stroke="#2c81d2" stroke-width="0.8"/>
</svg>
